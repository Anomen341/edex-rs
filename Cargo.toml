[package]
name = "edex-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "A native sci-fi terminal and system monitor"

[dependencies]
alacritty_terminal = "0.26.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37.0"
portable-pty = "0.9.0"
rfd = "0.17.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "component"] }

# Dependencies are optimised even in dev builds: unoptimised software rendering
# is unusably slow. Debug info is trimmed because the build VM's disk is small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Foundation"] }
